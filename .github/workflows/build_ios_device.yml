name: Build iOS Device

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build archive
      run: |
        xcodebuild \
          -project ClearPadMobile/ClearPadMobile.xcodeproj \
          -scheme ClearPadMobile \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/ClearPadMobile.xcarchive \
          archive

    - name: Create ExportOptions.plist
      run: |
        cat <<EOF > ExportOptions.plist
        {
          "method": "ad-hoc",
          "teamID": "YOUR_TEAM_ID",
          "compileBitcode": false,
          "destination": "export",
          "signingStyle": "automatic"
        }
        EOF

    - name: Export IPA
      run: |
        xcodebuild \
          -exportArchive \
          -archivePath build/ClearPadMobile.xcarchive \
          -exportPath output \
          -exportOptionsPlist ExportOptions.plist

    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: ClearPadMobile-IPA
        path: output/*.ipa
