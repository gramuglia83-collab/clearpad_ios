name: Build iOS Device

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # ------------------------------------------------------------
    # Checkout repository
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------------------------------------
    # Build archive
    # ------------------------------------------------------------
    - name: Build archive
      run: |
        xcodebuild \
          -project ClearPadMobile/ClearPadMobile.xcodeproj \
          -scheme ClearPadMobile \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/ClearPadMobile.xcarchive \
          archive

    # ------------------------------------------------------------
    # Create ExportOptions.plist
    # ------------------------------------------------------------
    - name: Create ExportOptions.plist
      run: |
        cat <<EOF > ExportOptions.plist
        {
          "method": "ad-hoc",
          "teamID": "YOUR_TEAM_ID",
          "compileBitcode": false,
          "destination": "export",
          "signingStyle": "automatic"
        }
        EOF

    # ------------------------------------------------------------
    # Export IPA
    # ------------------------------------------------------------
    - name: Export IPA
      run: |
        xcodebuild \
          -exportArchive \
          -archivePath build/ClearPadMobile.xcarchive \
          -exportPath output \
          -exportOptionsPlist ExportOptions.plist

    # ------------------------------------------------------------
    # Upload IPA (v4)
    # ------------------------------------------------------------
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ClearPadMobile-IPA
        path: output/*.ipa
